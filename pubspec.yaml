name: sputube_client
description: A self-contained educational music streaming client in blue aesthetic.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  audio_service: ^0.18.15
  youtube_explode_dart: ^2.3.6
  http: ^1.2.2
  share_plus: ^10.0.2
  shared_preferences: ^2.3.2
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
